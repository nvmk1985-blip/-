name: Build Mobile APK (Pesalam AI)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build & Package Pesalam AI APK (v2.0 Gemini 3.8 Flash + Camera)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Prepare Latest Compiled APK (v2.0)
        run: |
          mkdir -p app/build/outputs/apk/debug
          if [ -f ".build-outputs/app-debug.apk" ]; then
            cp -f .build-outputs/app-debug.apk app/build/outputs/apk/debug/app-debug.apk
            ls -lh app/build/outputs/apk/debug/app-debug.apk
          else
            echo "Error: .build-outputs/app-debug.apk not found"
            exit 1
          fi

      - name: Upload Pesalam AI APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Pesalam-AI-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
