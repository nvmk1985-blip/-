name: Build Mobile APK (Pesalam AI)

on:
  push:
    branches: [ "main", "master", "**" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Pesalam AI APK (v2.2 Gemini 3.8 Flash + Mental Math + 5 Tones)
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Accept Android SDK Licenses & Prepare SDK 36.1
        shell: bash
        run: |
          set +o pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          if [ -x "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          fi
          for SDK_DIR in "${ANDROID_HOME:-}" "${ANDROID_SDK_ROOT:-}" "/usr/local/lib/android/sdk"; do
            if [ -n "$SDK_DIR" ] && [ -d "$SDK_DIR" ]; then
              mkdir -p "$SDK_DIR/licenses"
              printf "\n8933bad161af4178b1185d1a37fbf41ea5269c55\nd56f5187479451eabf01fb78af6dfcb131a6481e\n24333f8a63b6825ea9c5514f83c2829b004d1fee\n859f317696f67ef3d7f30a50a5560e7834b43903\n" > "$SDK_DIR/licenses/android-sdk-license"
              printf "\n84831b9409646a918e30573bab4c9c91346d8abd\n504667f4c0de7af1a06de9f4b1727b84351f2910\n" > "$SDK_DIR/licenses/android-sdk-preview-license"
              printf "\n601085b94cd77f0b54ff86406957099ebe79c4d6\n" > "$SDK_DIR/licenses/android-googletv-license"
              printf "\nceff83576aac4f7f37cb98fe189e9fb3c49d3b81\n" > "$SDK_DIR/licenses/android-googlexr-license"
              printf "\n859f317696f67ef3d7f30a50a5560e7834b43903\n" > "$SDK_DIR/licenses/android-sdk-arm-dbt-license"
              printf "\n33b6a2b64607f11b759f320ef9dff4ae5c47d97a\n" > "$SDK_DIR/licenses/google-gdk-license"
              printf "\ne9acab5b5fbb560a72cfaecce8946896ff6aab9d\n" > "$SDK_DIR/licenses/mips-android-sysimage-license"
            fi
          done
          if [ -x "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
            "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" >/dev/null 2>&1 || true
            "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36.1" >/dev/null 2>&1 || true
          fi
          if [ ! -d "$SDK_ROOT/platforms/android-36.1" ] && [ -d "$SDK_ROOT/platforms/android-36" ]; then
            cp -r "$SDK_ROOT/platforms/android-36" "$SDK_ROOT/platforms/android-36.1"
            sed -i 's/AndroidVersion.ApiLevel=36$/AndroidVersion.ApiLevel=36.1/g' "$SDK_ROOT/platforms/android-36.1/source.properties" || true
            sed -i 's/platforms;android-36"/platforms;android-36.1"/g' "$SDK_ROOT/platforms/android-36.1/package.xml" || true
          fi
          echo "✅ Android SDK & Preview licenses and platform 36.1 ready."

      - name: Restore Keystore, .env & Sanitize Resource Drawables
        shell: bash
        env:
          SECRET_GEMINI_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ ! -s "debug.keystore" ] && [ -s "debug.keystore.base64" ]; then
            base64 -di debug.keystore.base64 > debug.keystore || rm -f debug.keystore
            echo "✅ Decoded debug.keystore from debug.keystore.base64"
          fi
          if [ ! -s "debug.keystore" ]; then
            keytool -genkeypair -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
            echo "✅ Generated fallback debug.keystore"
          fi
          if [ ! -f ".env" ]; then
            if [ -f ".env.example" ]; then
              cp .env.example .env
            else
              echo "GEMINI_API_KEY=MY_GEMINI_API_KEY" > .env
            fi
          fi
          if [ -n "$SECRET_GEMINI_KEY" ]; then
            echo "GEMINI_API_KEY=$SECRET_GEMINI_KEY" > .env
            echo "✅ Injected GEMINI_API_KEY from GitHub Secrets into .env"
          fi
          # Remove any unexported or corrupted binary raster images in drawable/ and legacy mipmap folders
          # IMPORTANT: Keep adaptive icons ONLY in mipmap-anydpi-v26 (never in mipmap-anydpi without -v26 when minSdk=24)
          rm -f app/src/main/res/drawable/*.jpg app/src/main/res/drawable/*.png app/src/main/res/drawable/*.webp
          rm -rf app/src/main/res/mipmap-mdpi app/src/main/res/mipmap-hdpi app/src/main/res/mipmap-xhdpi app/src/main/res/mipmap-xxhdpi app/src/main/res/mipmap-xxxhdpi app/src/main/res/mipmap-anydpi
          if [ ! -s "app/src/main/res/drawable/ic_pesalam_avatar.xml" ]; then
            cp -f app/src/main/res/drawable/ic_launcher_foreground.xml app/src/main/res/drawable/ic_pesalam_avatar.xml
          fi

      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon --no-configuration-cache

      - name: Prepare APK Release Files
        shell: bash
        run: |
          mkdir -p release-assets
          cp app/build/outputs/apk/debug/app-debug.apk release-assets/Pesalam-AI.apk
          cp app/build/outputs/apk/debug/app-debug.apk release-assets/Pesalam-AI-v2.2.apk
          echo "✅ Release APKs prepared:"
          ls -lh release-assets/

      - name: Upload Pesalam AI APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Pesalam-AI-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Determine Release Tag & Version
        id: release_info
        shell: bash
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${{ github.ref_name }}"
            NAME="Pesalam AI ${TAG} (Direct Download APK)"
          else
            TAG="v2.2-build${{ github.run_number }}"
            NAME="Pesalam AI v2.2 (Build #${{ github.run_number }})"
          fi
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "name=${NAME}" >> $GITHUB_OUTPUT
          echo "✅ Target Release Tag: ${TAG}"

      - name: Publish APK to GitHub Releases (Direct Download)
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_info.outputs.tag }}
          name: ${{ steps.release_info.outputs.name }}
          body: |
            ## 📱 Pesalam AI Android APK v2.2

            Tamil & English AI Voice & Vision Assistant • 5 Voice Tones • Mental Math

            ### ⬇️ நேரடி பதிவிறக்கம் (Direct APK Download):
            - **[Pesalam-AI.apk (Latest)](https://github.com/${{ github.repository }}/releases/latest/download/Pesalam-AI.apk)** (பரிந்துரைக்கப்பட்டது / Recommended)
            - **[Pesalam-AI-v2.2.apk](https://github.com/${{ github.repository }}/releases/download/${{ steps.release_info.outputs.tag }}/Pesalam-AI-v2.2.apk)**

            ### 📌 புதிய சிறப்பம்சங்கள் (New Features in v2.2):
            - 🎙️ **5 Voice Tones (இயல்பான தமிழ் உச்சரிப்பு):** Dhanam Teacher, Subi, Storyteller, Speed Coach, Radio Presenter
            - 🧠 **Mental Math (மனக் கணக்கு):** ஆங்கில வினாக்கள் & தமிழ் படிமுறை விளக்கம் (Practice Drill, 60s Speed Quiz, Math Glossary)
            - 📷 **Textbook Camera & Live Vision:** பாடப்புத்தக சந்தேகம் தீர்க்கும் கேமரா வசதி
            - 🚀 **Gemini 3.8 Flash AI Engine:** அதிவேக இருமொழி பதில்கள்

            ### 📲 நிறுவும் முறை (Installation):
            1. Download `Pesalam-AI.apk`.
            2. Open the file on your Android device.
            3. If prompted, allow "Install Unknown Apps" (Settings -> Allow from this source).
          files: |
            release-assets/Pesalam-AI.apk
            release-assets/Pesalam-AI-v2.2.apk
            app/build/outputs/apk/debug/app-debug.apk
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
