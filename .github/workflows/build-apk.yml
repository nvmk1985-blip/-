name: Build Mobile APK (Pesalam AI)

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Installable Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK Platform 36.1
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-36" "platforms;android-36.1" "build-tools;36.0.0" || true

      - name: Prepare Keystore & Environment
        run: |
          if [ ! -f ".env" ]; then
            cp .env.example .env || touch .env
          fi
          if [ -n "${{ secrets.GEMINI_API_KEY }}" ]; then
            echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" >> .env
          fi
          if [ ! -f "debug.keystore" ]; then
            if [ -f "debug.keystore.base64" ]; then
              base64 -d debug.keystore.base64 > debug.keystore
            else
              keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
            fi
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.0'

      - name: Build Debug APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Rename APK for Easy Mobile Download
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk Pesalam-AI.apk

      - name: Upload APK to Actions Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Pesalam-AI-APK
          path: Pesalam-AI.apk

      - name: Publish APK to GitHub Releases (Direct Mobile Link)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0-latest
          name: "Pesalam AI - Mobile APK (Direct Download)"
          body: |
            ### 📱 Pesalam AI - Mobile APK
            கீழே உள்ள **`Pesalam-AI.apk`** கோப்பை நேரடியாக உங்கள் மொபைலில் தொட்டு டவுன்லோட் (Download) செய்து Install செய்யவும்!
          files: Pesalam-AI.apk
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
